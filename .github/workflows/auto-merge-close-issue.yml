name: Auto Merge PRs With Closing Issues

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Inspect pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const closesIssuePattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\d+\b/i;
            const hasClosingIssueReference = closesIssuePattern.test(body);

            const { data: freshPr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            core.setOutput("has_closing_issue_reference", String(hasClosingIssueReference));
            core.setOutput("mergeable_state", freshPr.mergeable_state || "unknown");
            core.setOutput("is_same_repo", String(freshPr.head.repo.full_name === freshPr.base.repo.full_name));
            core.setOutput("pull_number", String(freshPr.number));

      - name: Skip when PR body does not close an issue
        if: steps.pr.outputs.has_closing_issue_reference != 'true'
        run: echo "Skipping auto-merge because the PR description does not include close/fix/resolve #<issue>."

      - name: Skip forks for safety
        if: steps.pr.outputs.has_closing_issue_reference == 'true' && steps.pr.outputs.is_same_repo != 'true'
        run: echo "Skipping auto-merge because this PR branch is from a forked repository."

      - name: Update PR branch from base when needed
        if: steps.pr.outputs.has_closing_issue_reference == 'true' && steps.pr.outputs.is_same_repo == 'true' && (steps.pr.outputs.mergeable_state == 'behind' || steps.pr.outputs.mergeable_state == 'dirty')
        uses: actions/github-script@v7
        with:
          script: |
            const pull_number = Number("${{ steps.pr.outputs.pull_number }}");

            try {
              await github.rest.pulls.updateBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number,
              });
            } catch (error) {
              core.warning(`Unable to update PR #${pull_number} automatically: ${error.message}`);
            }

      - name: Merge pull request
        if: steps.pr.outputs.has_closing_issue_reference == 'true' && steps.pr.outputs.is_same_repo == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pull_number = Number("${{ steps.pr.outputs.pull_number }}");

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
            });

            if (pr.mergeable_state === "dirty") {
              core.setFailed(`PR #${pull_number} still has merge conflicts after auto-update.`);
              return;
            }

            if (!pr.mergeable) {
              core.setFailed(`PR #${pull_number} is not mergeable (state: ${pr.mergeable_state}).`);
              return;
            }

            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number,
                merge_method: "squash",
              });
            } catch (error) {
              core.setFailed(`Failed to merge PR #${pull_number}: ${error.message}`);
            }
