name: Auto Merge PRs With Closing Issues

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Inspect pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const closesIssuePattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\d+\b/i;
            const hasClosingIssueReference = closesIssuePattern.test(body);

            const { data: freshPr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            core.setOutput("has_closing_issue_reference", String(hasClosingIssueReference));
            core.setOutput("mergeable_state", freshPr.mergeable_state || "unknown");
            core.setOutput("head_ref", freshPr.head.ref);
            core.setOutput("base_ref", freshPr.base.ref);
            core.setOutput("is_same_repo", String(freshPr.head.repo.full_name === freshPr.base.repo.full_name));
            core.setOutput("pull_number", String(freshPr.number));

      - name: Skip when PR body does not close an issue
        if: steps.pr.outputs.has_closing_issue_reference != 'true'
        run: echo "Skipping auto-merge because the PR description does not include close/fix/resolve #<issue>."

      - name: Checkout repository for conflict resolution
        if: steps.pr.outputs.has_closing_issue_reference == 'true' && steps.pr.outputs.mergeable_state == 'dirty' && steps.pr.outputs.is_same_repo == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve merge conflicts by updating PR branch
        if: steps.pr.outputs.has_closing_issue_reference == 'true' && steps.pr.outputs.mergeable_state == 'dirty' && steps.pr.outputs.is_same_repo == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${{ steps.pr.outputs.base_ref }}" "${{ steps.pr.outputs.head_ref }}"
          git checkout "${{ steps.pr.outputs.head_ref }}"

          if ! git merge "origin/${{ steps.pr.outputs.base_ref }}" -X ours --no-edit; then
            echo "Unable to auto-resolve merge conflicts for PR #${{ steps.pr.outputs.pull_number }}"
            git merge --abort || true
            exit 1
          fi

          git push origin "HEAD:${{ steps.pr.outputs.head_ref }}"

      - name: Wait for mergeability refresh
        if: steps.pr.outputs.has_closing_issue_reference == 'true' && steps.pr.outputs.mergeable_state == 'dirty' && steps.pr.outputs.is_same_repo == 'true'
        run: sleep 10

      - name: Merge pull request
        if: steps.pr.outputs.has_closing_issue_reference == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pull_number = Number("${{ steps.pr.outputs.pull_number }}");

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
            });

            if (!pr.mergeable) {
              core.setFailed(`PR #${pull_number} is not mergeable (state: ${pr.mergeable_state}).`);
              return;
            }

            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number,
                merge_method: "squash",
              });
            } catch (error) {
              core.setFailed(`Failed to merge PR #${pull_number}: ${error.message}`);
            }
