<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2DD4BF" />
    <title>Offline · Stellar-star</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f6f6f6; color: #0f0f14; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 28rem; padding: 2rem; border: 1px solid #ddd; border-radius: 1rem; background: white; }
      h1 { margin-top: 0; } p { line-height: 1.55; } button { min-height: 44px; border: 0; border-radius: .6rem; padding: .7rem 1rem; background: #0f0f14; color: white; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Stellar-star’s offline shell is ready. Previously synced trips and expenses are available after you reconnect and sign in to the same wallet. Expense drafts can be queued, but signing, payments, and settlement recording require a live connection.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
